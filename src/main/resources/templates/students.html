<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
        h1 { margin-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f4f4f4; }
        a.btn, button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;
                        text-decoration: none; font-size: 14px; color: #fff; }
        .add { background: #2e7d32; display: inline-block; }
        .edit { background: #1565c0; }
        .delete { background: #c62828; }
        form { display: inline; }
        .empty { color: #777; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Student Management System</h1>
    <a class="btn add" th:href="@{/students/new}">+ Add Student</a>

    <table th:if="${!students.isEmpty()}">
        <thead>
            <tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Email</th><th>Course</th><th>Actions</th></tr>
        </thead>
        <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.firstName}"></td>
                <td th:text="${s.lastName}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.course}"></td>
                <td>
                    <a class="btn edit" th:href="@{/students/edit/{id}(id=${s.id})}">Edit</a>
                    <form th:action="@{/students/delete/{id}(id=${s.id})}" method="post"
                          onsubmit="return confirm('Delete this student?');">
                        <button class="delete" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <p class="empty" th:if="${students.isEmpty()}">No students yet. Click "Add Student" to create one.</p>
</body>
</html>
